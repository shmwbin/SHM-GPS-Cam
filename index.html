<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM-GPS-Cam (Front/Back)</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078A8">
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; margin: 0; padding-bottom: 90px; }
        .camera-container { position: relative; display: inline-block; max-width: 100%; width: 100%; border: 3px solid #333; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        video { width: 100%; max-width: 500px; display: block; margin: auto; transition: transform 0.3s ease; }
        .mirror { transform: scaleX(-1); } 
        
        .overlay { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; text-align: left; line-height: 1.6; font-family: monospace; }
        
        .btn-group { margin-top: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
        button { padding: 12px 20px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
        
        .btn-capture { background-color: #ea4335; }
        .btn-capture:hover { background-color: #d33426; }
        .btn-switch { background-color: #4CAF50; }
        .btn-switch:hover { background-color: #388E3C; }
        .btn-download { background-color: #0078A8; display: none; }
        .btn-download:hover { background-color: #005f86; }
        
        canvas { display: none; width: 100%; max-width: 500px; margin: 20px auto; border: 3px solid #0078A8; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .app-title { color: #0078A8; font-weight: bold; font-size: 24px; margin-bottom: 15px; }

        /* ইন্সটল অ্যাপ বিগ ব্যানার স্টাইল */
        #install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid #334155;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
            padding: 14px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            animation: slideUp 0.4s ease-out;
            box-sizing: border-box;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .banner-content {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .banner-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #0078A8;
        }

        .banner-text h3 {
            font-size: 14px;
            color: #f8fafc;
            font-weight: 600;
            margin: 0 0 2px 0;
        }

        .banner-text p {
            font-size: 11px;
            color: #94a3b8;
            margin: 0;
        }

        .banner-actions {
            display: flex;
            gap: 8px;
        }

        .install-yes-btn {
            background: #0078A8;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 120, 168, 0.4);
        }

        .install-close-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 10px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-title">📷 SHM-GPS-Cam</div>
    
    <div class="camera-container" style="max-width: 500px; margin: auto;">
        <video id="video" autoplay playsinline></video>
        <div id="locationOverlay" class="overlay">জিপিএস ও ক্যামেরা চালু হচ্ছে...</div>
    </div>

    <div class="btn-group">
        <button class="btn-switch" onclick="toggleCamera()">🔄 ক্যামেরা ঘোরান</button>
        <button class="btn-capture" onclick="takePhoto()">📸 ছবি তুলুন</button>
        <button id="downloadBtn" class="btn-download" onclick="downloadPhoto()">⬇️ ডাউনলোড</button>
    </div>

    <canvas id="canvas"></canvas>

    <!-- আকর্ষণীয় ইন্সটল অ্যাপ বিগ ব্যানার -->
    <div id="install-banner">
        <div class="banner-content">
            <img src="https://res.cloudinary.com/ewu5hckc/image/upload/v1790515432/shmgpscam.png" alt="App Icon" class="banner-icon">
            <div class="banner-text">
                <h3>SHM-GPS-Cam</h3>
                <p>দ্রুত ব্যবহারের জন্য অ্যাপটি ইনস্টল করুন</p>
            </div>
        </div>
        <div class="banner-actions">
            <button class="install-yes-btn" id="installBtnApp">Install</button>
            <button class="install-close-btn" id="installCloseBtn">✕</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('locationOverlay');
        const canvas = document.getElementById('canvas');
        const downloadBtn = document.getElementById('downloadBtn');
        const ctx = canvas.getContext('2d');
        
        let currentLat = "Searching...";
        let currentLng = "Searching...";
        let placeName = "Searching location...";
        let lastLat = "";
        
        let useFrontCamera = false;
        let currentStream = null;

        // PWA Install Prompt Logic
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const installBtnApp = document.getElementById('installBtnApp');
        const installCloseBtn = document.getElementById('installCloseBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'flex';
        });

        installBtnApp.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
                installBanner.style.display = 'none';
            }
        });

        installCloseBtn.addEventListener('click', () => {
            installBanner.style.display = 'none';
        });

        function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment"
                }
            };

            if (useFrontCamera) {
                video.classList.add('mirror');
            } else {
                video.classList.remove('mirror');
            }

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    currentStream = stream;
                    video.srcObject = stream;
                })
                .catch(err => {
                    overlay.innerHTML = "ক্যামেরা পারমিশন দেওয়া হয়নি বা ক্যামেরা পাওয়া যাচ্ছে না!";
                    alert("ক্যামেরা চালু করা যাচ্ছে না। পারমিশন চেক করুন।");
                });
        }

        function toggleCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        startCamera();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                async position => {
                    currentLat = position.coords.latitude.toFixed(5);
                    currentLng = position.coords.longitude.toFixed(5);
                    updateOverlay(); 

                    if (currentLat !== lastLat) {
                        lastLat = currentLat;
                        try {
                            const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${currentLat}&longitude=${currentLng}&localityLanguage=en`);
                            const data = await res.json();
                            placeName = (data.locality || data.city || data.principalSubdivision || "Unknown Area") + ", " + (data.countryName || "");
                            updateOverlay();
                        } catch (e) {
                            placeName = "Area name not found";
                        }
                    }
                },
                error => {
                    overlay.innerHTML = "জিপিএস সিগন্যাল পাওয়া যাচ্ছে না। ঘরের বাইরে চেষ্টা করুন।";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function updateOverlay() {
            const timeNow = new Date().toLocaleString('en-US');
            overlay.innerHTML = `<span style="color:#FFD700; font-weight:bold;">📷 SHM-GPS-Cam</span><br>📍 ${placeName}<br>🌍 Lat: ${currentLat}, Lng: ${currentLng}<br>🕒 Time: ${timeNow}`;
        }

        function takePhoto() {
            if(video.videoWidth === 0) {
                alert("ক্যামেরা প্রস্তুত নয়, অনুগ্রহ করে অপেক্ষা করুন।");
                return;
            }
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            if (useFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            if (useFrontCamera) {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }
            
            const timeNow = new Date().toLocaleString('en-US');
            const boxHeight = 115; 
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; 
            ctx.fillRect(10, canvas.height - boxHeight - 10, canvas.width - 20, boxHeight);
            
            ctx.fillStyle = "white"; 
            ctx.font = "16px monospace"; 
            
            const startY = canvas.height - boxHeight + 20;
            
            ctx.fillStyle = "#FFD700"; 
            ctx.fillText(`Camera: SHM-GPS-Cam`, 20, startY);
            
            ctx.fillStyle = "white"; 
            ctx.fillText(`Place : ${placeName}`, 20, startY + 25);
            ctx.fillText(`GPS   : Lat ${currentLat}, Lng ${currentLng}`, 20, startY + 50);
            ctx.fillText(`Time  : ${timeNow}`, 20, startY + 75);
            
            canvas.style.display = "block";
            downloadBtn.style.display = "inline-block";
        }

        function downloadPhoto() {
            const link = document.createElement('a');
            link.download = `SHM-GPS-Cam_${new Date().getTime()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        }
    </script>

    <!-- Service Worker Registration Script -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <!-- Footer inside Panel -->
    <div class="panel-footer" style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 20px; margin-top: 35px; flex-wrap: wrap; gap: 15px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="https://res.cloudinary.com/ewu5hckc/image/upload/v1790515432/shmgpscam.png" alt="SHM Logo" style="width: 32px; height: 32px; object-fit: contain;">
            <span style="color: #94a3b8; font-size: 14px;">
                &copy; <a href="https://www.shmwb.in" style="color: #4ade80; text-decoration: none; font-weight: 600;">shmwb.in</a>. All Rights Reserved.
            </span>
        </div>
        <div>
            <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fwww.shmwb.in&label=SITE%20VISITORS&labelColor=%232d3748&countColor=%23007bff" alt="Site Visitors" style="height: 25px; border-radius: 4px;">
        </div>
    </div>
</body>
</html>
